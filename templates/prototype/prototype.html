{% extends "base.html" %}
{% block title %}Prototype — Catalyst Canvas{% endblock %}
{% block content %}
<section class="panel">
  <p class="label">Prototype</p>
  <h2>Make the smallest useful version</h2>
  <form method="post">
    <label>Prototype concept</label><textarea name="prototype">{{ canvas.get('prototype','') }}</textarea>
    <label>Risk note</label><textarea name="risk_note">{{ canvas.get('risk_note','') }}</textarea>
    <div class="actions"><button class="btn" type="submit">Save and test →</button><a class="btn" href="{{ url_for('canvas.storyboard') }}">Storyboard →</a></div>
  </form>
</section>
{% endblock %}
