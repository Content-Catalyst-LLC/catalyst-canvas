{% extends "base.html" %}
{% block title %}Define — Catalyst Canvas{% endblock %}
{% block content %}
<section class="panel">
  <p class="label">Define</p>
  <h2>Frame the problem</h2>
  <form method="post">
    <label>Brief title</label><input name="title" value="{{ canvas.get('title','') }}">
    <label>Challenge</label><textarea name="challenge">{{ canvas.get('challenge','') }}</textarea>
    <label>Audience</label><input name="audience" value="{{ canvas.get('audience','') }}">
    <label>Goal</label><textarea name="goal">{{ canvas.get('goal','') }}</textarea>
    <label>Constraint</label><textarea name="constraint">{{ canvas.get('constraint','') }}</textarea>
    <label>Evidence currently available</label><textarea name="evidence">{{ canvas.get('evidence','') }}</textarea>
    <label>Key assumption</label><textarea name="assumption">{{ canvas.get('assumption','') }}</textarea>
    <div class="actions"><button class="btn" type="submit">Save and continue →</button></div>
  </form>
</section>
{% endblock %}
