{% extends "base.html" %}
{% block title %}Ideate — Catalyst Canvas{% endblock %}
{% block content %}
<section class="panel">
  <p class="label">Ideate</p>
  <h2>Generate a testable direction</h2>
  <form method="get" class="actions">
    <select name="framework">
      {% for name in frameworks.keys() %}<option value="{{ name }}" {% if name == framework %}selected{% endif %}>{{ name }}</option>{% endfor %}
    </select>
    <button class="btn" type="submit">Load framework</button>
  </form>
  <div class="grid two">
    {% for prompt in prompts %}<article class="card"><h3>Prompt</h3><p>{{ prompt }}</p></article>{% endfor %}
  </div>
  <form method="post">
    <label>How might we statement</label><textarea name="how_might_we">{{ canvas.get('how_might_we','') }}</textarea>
    <label>Prototype concept</label><textarea name="prototype">{{ canvas.get('prototype','') }}</textarea>
    <div class="actions"><button class="btn" type="submit">Save and prototype →</button></div>
  </form>
</section>
{% endblock %}
