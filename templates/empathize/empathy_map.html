{% extends "base.html" %}
{% block title %}Empathize — Catalyst Canvas{% endblock %}
{% block content %}
<section class="panel">
  <p class="label">Empathize</p>
  <h2>Map the human context</h2>
  <form method="post" data-autosave-project="{{ canvas.get('project_id','') }}">
    <label>Persona name</label><input name="persona_name" value="{{ canvas.get('persona_name','') }}">
    <label>Persona role / context</label><textarea name="persona_role">{{ canvas.get('persona_role','') }}</textarea>
    <label>Needs</label><textarea name="persona_needs">{{ canvas.get('persona_needs','') }}</textarea>
    <label>Pains / frictions</label><textarea name="persona_pains">{{ canvas.get('persona_pains','') }}</textarea>
    <div class="actions"><button class="btn" type="submit">Save and ideate →</button><a class="btn" href="{{ url_for('canvas.personas') }}">Sample personas →</a></div>
  </form>
</section>
{% endblock %}
