{% extends "base.html" %}
{% block title %}Test — Catalyst Canvas{% endblock %}
{% block content %}
<section class="panel">
  <p class="label">Test</p>
  <h2>Define the learning test</h2>
  <form method="post">
    <label>Test plan</label><textarea name="test_plan">{{ canvas.get('test_plan','') }}</textarea>
    <label>Success signal</label><textarea name="success_signal">{{ canvas.get('success_signal','') }}</textarea>
    <label>Review note</label><textarea name="review_note">{{ canvas.get('review_note','') }}</textarea>
    <div class="actions"><button class="btn" type="submit">Save and view report →</button></div>
  </form>
</section>
{% endblock %}
