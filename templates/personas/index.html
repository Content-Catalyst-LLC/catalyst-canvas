{% extends "base.html" %}
{% block title %}Personas — Catalyst Canvas{% endblock %}
{% block content %}
<section class="panel">
  <p class="label">Personas</p>
  <h2>Sample audience patterns</h2>
  <div class="grid">
    {% for persona in personas %}
    <article class="card"><h3>{{ persona.name }}</h3><p>{{ persona.role }}</p><a class="small-link" href="{{ url_for('canvas.persona_view', slug=persona.slug) }}">View →</a></article>
    {% endfor %}
  </div>
  <div class="actions"><a class="btn" href="{{ url_for('canvas.persona_edit') }}">Edit current persona →</a><a class="btn" href="{{ url_for('canvas.ga4_import') }}">GA4 sample import →</a></div>
</section>
{% endblock %}
