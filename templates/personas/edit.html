{% extends "base.html" %}
{% block title %}Edit Persona — Catalyst Canvas{% endblock %}
{% block content %}
<section class="panel">
  <p class="label">Persona</p>
  <h2>Edit current persona</h2>
  <form method="post">
    <label>Persona name</label><input name="persona_name" value="{{ canvas.get('persona_name','') }}">
    <label>Role</label><textarea name="persona_role">{{ canvas.get('persona_role','') }}</textarea>
    <label>Needs</label><textarea name="persona_needs">{{ canvas.get('persona_needs','') }}</textarea>
    <label>Pains</label><textarea name="persona_pains">{{ canvas.get('persona_pains','') }}</textarea>
    <div class="actions"><button class="btn" type="submit">Save persona →</button></div>
  </form>
</section>
{% endblock %}
