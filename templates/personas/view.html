{% extends "base.html" %}
{% block title %}{{ persona.name }} — Catalyst Canvas{% endblock %}
{% block content %}
<section class="panel">
  <p class="label">Persona</p>
  <h2>{{ persona.name }}</h2>
  <div class="grid">
    <article class="card"><h3>Role</h3><p>{{ persona.role }}</p></article>
    <article class="card"><h3>Needs</h3><p>{{ persona.needs }}</p></article>
    <article class="card"><h3>Pains</h3><p>{{ persona.pains }}</p></article>
  </div>
</section>
{% endblock %}
