name: Catalyst Canvas Release Validation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: catalyst-canvas-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12', '3.13']

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Validate release
        run: python scripts/validate_release.py

      - name: Build versioned WordPress plugin
        if: matrix.python-version == '3.13'
        run: python scripts/build_plugin.py

      - name: Upload WordPress plugin artifact
        if: matrix.python-version == '3.13'
        uses: actions/upload-artifact@v4
        with:
          name: catalyst-canvas-wordpress-plugin
          path: dist/catalyst-canvas-demo-v*.zip
          if-no-files-found: error
